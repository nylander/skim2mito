# profile for NRM, local

# number of cores to use
cores: 4

# use conda environments
use-conda: True

# total memory budget for all concurrent jobs
resources:
  mem_mb: 20000

# default resources for all rules
default-resources:
  mem_mb: 8000
  runtime: 6h
  threads: 4

# specific resources for certain rules
set-resources:
  getorganelle:
    mem_mb: 50000
    runtime: 24h
    threads: 4
  blobtools_create:
    mem_mb: 16000

# rerun incomplete jobs
rerun-incomplete: True

# Latency wait for snakemake
latency-wait: 60
